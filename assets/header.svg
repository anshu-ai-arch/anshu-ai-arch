<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <!-- Background Canvas matching GitHub Dark Mode -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="tech-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363D" stroke-width="0.6" stroke-opacity="0.3" />
    </pattern>

    <!-- Status Indicator Glow -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono-meta {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #A1A1AA;
    }
    .status-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #10B981;
    }
    .hero-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #FAF5EE;
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      fill: #A1A1AA;
    }
    .highlight-engineer {
      fill: #10B981;
      font-weight: 700;
    }
    .highlight-research {
      fill: #F59E0B;
      font-weight: 700;
    }
    .tag-mono {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #D4D4D8;
    }
  </style>

  <!-- Canvas Surface -->
  <rect width="880" height="220" rx="10" fill="url(#hero-bg)" stroke="#30363D" stroke-width="1" />
  <rect width="880" height="220" rx="10" fill="url(#tech-grid)" />

  <!-- Top Metadata Row -->
  <g transform="translate(36, 36)">
    <!-- Identity Label -->
    <text x="0" y="0" class="mono-meta">ANSHU TIWARI / PORTFOLIO</text>

    <!-- Available Status Pill -->
    <g transform="translate(640, -12)">
      <rect width="168" height="24" rx="12" fill="#062E23" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="14" cy="12" r="3.5" fill="#10B981" filter="url(#emerald-glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="15.5" class="status-text">AVAILABLE FOR AI</text>
    </g>
  </g>

  <!-- Main Identity Headline -->
  <g transform="translate(36, 78)">
    <text x="0" y="0" class="hero-name">ANSHU TIWARI</text>
    <text x="0" y="28" class="hero-title">
      <tspan class="highlight-engineer">AI Engineer</tspan>
      <tspan fill="#52525B"> &bull; </tspan>
      <tspan>Agentic Systems</tspan>
      <tspan fill="#52525B"> &bull; </tspan>
      <tspan class="highlight-research">Biomedical AI Research</tspan>
    </text>
  </g>

  <!-- Architectural Focus Pill Bar -->
  <g transform="translate(36, 148)">
    <!-- Pill 1: LLMs & RAG -->
    <rect x="0" y="0" width="118" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="14" cy="15" r="2.5" fill="#10B981" />
    <text x="24" y="19" class="tag-mono">LLMs &amp; RAG</text>

    <!-- Pill 2: Multi-Agent Systems -->
    <rect x="128" y="0" width="168" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="14" cy="15" r="2.5" fill="#10B981" />
    <text x="24" y="19" class="tag-mono">Multi-Agent Systems</text>

    <!-- Pill 3: ECG & EEG Research -->
    <rect x="306" y="0" width="176" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="14" cy="15" r="2.5" fill="#F59E0B" />
    <text x="24" y="19" class="tag-mono">ECG / EEG Research</text>

    <!-- Pill 4: Explainable AI -->
    <rect x="492" y="0" width="154" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="14" cy="15" r="2.5" fill="#F59E0B" />
    <text x="24" y="19" class="tag-mono">Explainable AI (XAI)</text>

    <!-- Pill 5: Systems C++ -->
    <rect x="656" y="0" width="150" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="14" cy="15" r="2.5" fill="#A1A1AA" />
    <text x="24" y="19" class="tag-mono">Systems &amp; Runtime</text>
  </g>
</svg>