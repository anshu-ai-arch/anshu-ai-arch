<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <!-- Background Canvas matching GitHub Dark Mode -->
    <linearGradient id="proj-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Card Clip Path -->
    <clipPath id="card-edge-clip">
      <rect width="396" height="124" rx="8" />
    </clipPath>
  </defs>

  <style>
    .meta-tag {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #A1A1AA;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.3px;
      fill: #FAF5EE;
    }
    .card-title-research {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #F59E0B;
    }
    .card-title-eng {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #10B981;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      fill: #A1A1AA;
      line-height: 1.45;
    }
    .tag-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
    }
    .link-arrow {
      stroke: #71717A;
      stroke-width: 1.2;
      fill: none;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="880" height="500" rx="10" fill="url(#proj-bg-dark)" stroke="#30363D" stroke-width="1" />

  <!-- Section Header -->
  <g transform="translate(36, 30)">
    <text x="0" y="0" class="meta-tag">03 // SELECTED PRODUCTION &amp; RESEARCH REPOSITORIES</text>
    <text x="0" y="24" class="main-title">Featured Technical Artifacts</text>
  </g>

  <!-- ================= ROW 1 ================= -->
  <!-- Card 1: eeg_seizure_detection (Top Left) -->
  <g transform="translate(36, 76)">
    <rect width="396" height="124" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="124" fill="#F59E0B" clip-path="url(#card-edge-clip)" />
    <text x="18" y="26" class="card-title-research">eeg_seizure_detection</text>
    <path d="M 368 16 L 376 16 M 376 16 L 376 24 M 376 16 L 370 22" class="link-arrow" />
    <text x="18" y="48" class="card-desc">Deep learning models for automated epileptic seizure</text>
    <text x="18" y="64" class="card-desc">detection from multi-channel EEG biological telemetry.</text>
    <g transform="translate(18, 90)">
      <rect width="56" height="20" rx="4" fill="#241B08" stroke="#F59E0B" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#FCD34D">Python</text>
      <rect x="64" y="0" width="46" height="20" rx="4" fill="#241B08" stroke="#F59E0B" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#FCD34D">EEG</text>
      <rect x="118" y="0" width="94" height="20" rx="4" fill="#241B08" stroke="#F59E0B" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#FCD34D">Deep Learning</text>
    </g>
  </g>

  <!-- Card 2: cornflakes-copilot- (Top Right) -->
  <g transform="translate(448, 76)">
    <rect width="396" height="124" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="124" fill="#10B981" clip-path="url(#card-edge-clip)" />
    <text x="18" y="26" class="card-title-eng">cornflakes-copilot-</text>
    <path d="M 368 16 L 376 16 M 376 16 L 376 24 M 376 16 L 370 22" class="link-arrow" />
    <text x="18" y="48" class="card-desc">Autonomous SRE incident copilot — deterministic triage,</text>
    <text x="18" y="64" class="card-desc">BM25 runbook RAG, chaos testing, exactly-once execution.</text>
    <g transform="translate(18, 90)">
      <rect width="70" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">AI Agents</text>
      <rect x="78" y="0" width="60" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">FastAPI</text>
      <rect x="146" y="0" width="94" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">Docker &bull; RAG</text>
    </g>
  </g>

  <!-- ================= ROW 2 ================= -->
  <!-- Card 3: gpt2_interpretability_research (Mid Left) -->
  <g transform="translate(36, 214)">
    <rect width="396" height="124" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="124" fill="#F59E0B" clip-path="url(#card-edge-clip)" />
    <text x="18" y="26" class="card-title-research">gpt2_interpretability_research</text>
    <path d="M 368 16 L 376 16 M 376 16 L 376 24 M 376 16 L 370 22" class="link-arrow" />
    <text x="18" y="48" class="card-desc">Mechanistic interpretability research on GPT-2 transformers</text>
    <text x="18" y="64" class="card-desc">— probing attention heads, residual stream activations.</text>
    <g transform="translate(18, 90)">
      <rect width="44" height="20" rx="4" fill="#241B08" stroke="#F59E0B" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#FCD34D">XAI</text>
      <rect x="52" y="0" width="90" height="20" rx="4" fill="#241B08" stroke="#F59E0B" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#FCD34D">Transformers</text>
      <rect x="150" y="0" width="60" height="20" rx="4" fill="#241B08" stroke="#F59E0B" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#FCD34D">PyTorch</text>
    </g>
  </g>

  <!-- Card 4: hostalgrid-plus-plus (Mid Right) -->
  <g transform="translate(448, 214)">
    <rect width="396" height="124" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="124" fill="#10B981" clip-path="url(#card-edge-clip)" />
    <text x="18" y="26" class="card-title-eng">hostalgrid-plus-plus</text>
    <path d="M 368 16 L 376 16 M 376 16 L 376 24 M 376 16 L 370 22" class="link-arrow" />
    <text x="18" y="48" class="card-desc">Computational resource allocation modeling and grid</text>
    <text x="18" y="64" class="card-desc">optimization algorithms for high-throughput computing.</text>
    <g transform="translate(18, 90)">
      <rect width="84" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">Optimization</text>
      <rect x="92" y="0" width="80" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">Algorithms</text>
      <rect x="180" y="0" width="60" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">Jupyter</text>
    </g>
  </g>

  <!-- ================= ROW 3 ================= -->
  <!-- Card 5: MOSIP1 (Bottom Left) -->
  <g transform="translate(36, 352)">
    <rect width="396" height="124" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="124" fill="#10B981" clip-path="url(#card-edge-clip)" />
    <text x="18" y="26" class="card-title-eng">MOSIP1</text>
    <path d="M 368 16 L 376 16 M 376 16 L 376 24 M 376 16 L 370 22" class="link-arrow" />
    <text x="18" y="48" class="card-desc">Scalable TypeScript integration for national-scale open</text>
    <text x="18" y="64" class="card-desc">digital identity architecture and modular services.</text>
    <g transform="translate(18, 90)">
      <rect width="80" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">TypeScript</text>
      <rect x="88" y="0" width="60" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">Systems</text>
      <rect x="156" y="0" width="60" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">Identity</text>
    </g>
  </g>

  <!-- Card 6: RazorOps (Bottom Right) -->
  <g transform="translate(448, 352)">
    <rect width="396" height="124" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="124" fill="#10B981" clip-path="url(#card-edge-clip)" />
    <text x="18" y="26" class="card-title-eng">razorops</text>
    <path d="M 368 16 L 376 16 M 376 16 L 376 24 M 376 16 L 370 22" class="link-arrow" />
    <text x="18" y="48" class="card-desc">Production-grade automated CI/CD pipeline automation,</text>
    <text x="18" y="64" class="card-desc">containerized workflows, and build acceleration.</text>
    <g transform="translate(18, 90)">
      <rect width="56" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">CI/CD</text>
      <rect x="64" y="0" width="56" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">Docker</text>
      <rect x="128" y="0" width="64" height="20" rx="4" fill="#062E23" stroke="#10B981" stroke-width="0.8" />
      <text x="10" y="14" class="tag-mono" fill="#6EE7B7">DevOps</text>
    </g>
  </g>
</svg>
