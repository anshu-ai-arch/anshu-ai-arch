<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="100%" height="100%">
  <defs>
    <!-- Soft card drop shadow for ivory canvas -->
    <filter id="card-shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#1C1917" flood-opacity="0.05" />
    </filter>

    <!-- Clip path for card rounded corners on left accent strip -->
    <clipPath id="card-clip">
      <rect width="396" height="140" rx="10" />
    </clipPath>
  </defs>

  <style>
    .header-tag {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      fill: #D97706;
      text-transform: uppercase;
    }
    .header-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      fill: #1C1917;
    }
    .header-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.1px;
      fill: #78716C;
    }
    .title-pine {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #064E3B;
    }
    .title-amber {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #D97706;
    }
    .proj-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      line-height: 16px;
      fill: #44403C;
    }
    .tag-pine {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 600;
      fill: #064E3B;
    }
    .tag-amber {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 600;
      fill: #92400E;
    }
    .link-icon {
      stroke: #A8A29E;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .emoji {
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
      font-size: 14px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="880" height="560" rx="14" fill="#F9F6F0" stroke="#D6D3CE" stroke-width="1.2" />

  <!-- Header Section -->
  <g transform="translate(38, 0)">
    <text x="0" y="33" class="header-tag">ENGINEERING &amp; RESEARCH ARTIFACTS</text>
    <text x="0" y="55" class="header-title">Featured Repositories</text>
    <text x="0" y="72" class="header-subtitle">A curated selection across AI research and production engineering</text>
  </g>

  <!-- ================= ROW 1 ================= -->
  <!-- Card 1: eeg_seizure_detection (Top Left) -->
  <g transform="translate(38, 85)">
    <rect width="396" height="140" rx="10" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="4" height="140" fill="#064E3B" clip-path="url(#card-clip)" />
    <text x="20" y="28" class="title-pine"><tspan class="emoji">🧠</tspan><tspan dx="7">eeg_seizure_detection</tspan></text>
    <path d="M 368 18 L 376 18 M 376 18 L 376 26 M 376 18 L 370 24" class="link-icon" />
    <text x="20" y="52" class="proj-desc">Deep learning models for automated epileptic seizure</text>
    <text x="20" y="68" class="proj-desc">detection from multi-channel EEG brainwave recordings.</text>
    <!-- Tags -->
    <rect x="20" y="98" width="54" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="47" y="113" text-anchor="middle" class="tag-pine">Python</text>
    <rect x="82" y="98" width="38" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="101" y="113" text-anchor="middle" class="tag-pine">EEG</text>
    <rect x="128" y="98" width="98" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="177" y="113" text-anchor="middle" class="tag-pine">Deep Learning</text>
  </g>

  <!-- Card 2: gpt2_interpretability_research (Top Right) -->
  <g transform="translate(446, 85)">
    <rect width="396" height="140" rx="10" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="4" height="140" fill="#064E3B" clip-path="url(#card-clip)" />
    <text x="20" y="28" class="title-pine"><tspan class="emoji">🔬</tspan><tspan dx="7">gpt2_interpretability_research</tspan></text>
    <path d="M 368 18 L 376 18 M 376 18 L 376 26 M 376 18 L 370 24" class="link-icon" />
    <text x="20" y="52" class="proj-desc">Mechanistic interpretability research on GPT-2 transformer</text>
    <text x="20" y="68" class="proj-desc">internals — probing attention heads and activation patterns.</text>
    <!-- Tags -->
    <rect x="20" y="98" width="54" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="47" y="113" text-anchor="middle" class="tag-pine">Python</text>
    <rect x="82" y="98" width="38" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="101" y="113" text-anchor="middle" class="tag-pine">XAI</text>
    <rect x="128" y="98" width="96" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="176" y="113" text-anchor="middle" class="tag-pine">Transformers</text>
  </g>

  <!-- ================= ROW 2 ================= -->
  <!-- Card 3: 500-AI-Agents-Projects (Middle Left) -->
  <g transform="translate(38, 237)">
    <rect width="396" height="140" rx="10" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="4" height="140" fill="#D97706" clip-path="url(#card-clip)" />
    <text x="20" y="28" class="title-amber"><tspan class="emoji">🤖</tspan><tspan dx="7">500-AI-Agents-Projects</tspan></text>
    <path d="M 368 18 L 376 18 M 376 18 L 376 26 M 376 18 L 370 24" class="link-icon" />
    <text x="20" y="52" class="proj-desc">Curated industrial showcase of autonomous AI agent</text>
    <text x="20" y="68" class="proj-desc">architectures, workflows, and production design patterns.</text>
    <!-- Tags -->
    <rect x="20" y="98" width="54" height="22" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8" />
    <text x="47" y="113" text-anchor="middle" class="tag-amber">Python</text>
    <rect x="82" y="98" width="74" height="22" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8" />
    <text x="119" y="113" text-anchor="middle" class="tag-amber">AI Agents</text>
    <rect x="164" y="98" width="46" height="22" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8" />
    <text x="187" y="113" text-anchor="middle" class="tag-amber">LLMs</text>
  </g>

  <!-- Card 4: hostalgrid-plus-plus (Middle Right) -->
  <g transform="translate(446, 237)">
    <rect width="396" height="140" rx="10" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="4" height="140" fill="#D97706" clip-path="url(#card-clip)" />
    <text x="20" y="28" class="title-amber"><tspan class="emoji">⚡</tspan><tspan dx="7">hostalgrid-plus-plus</tspan></text>
    <path d="M 368 18 L 376 18 M 376 18 L 376 26 M 376 18 L 370 24" class="link-icon" />
    <text x="20" y="52" class="proj-desc">Computational models and algorithmic frameworks for</text>
    <text x="20" y="68" class="proj-desc">grid resource allocation and optimization.</text>
    <!-- Tags -->
    <rect x="20" y="98" width="60" height="22" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8" />
    <text x="50" y="113" text-anchor="middle" class="tag-amber">Jupyter</text>
    <rect x="88" y="98" width="80" height="22" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8" />
    <text x="128" y="113" text-anchor="middle" class="tag-amber">Algorithms</text>
    <rect x="176" y="98" width="92" height="22" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="0.8" />
    <text x="222" y="113" text-anchor="middle" class="tag-amber">Optimization</text>
  </g>

  <!-- ================= ROW 3 ================= -->
  <!-- Card 5: MOSIP1 (Bottom Left) -->
  <g transform="translate(38, 389)">
    <rect width="396" height="140" rx="10" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="4" height="140" fill="#064E3B" clip-path="url(#card-clip)" />
    <text x="20" y="28" class="title-pine"><tspan class="emoji">🛡️</tspan><tspan dx="7">MOSIP1</tspan></text>
    <path d="M 368 18 L 376 18 M 376 18 L 376 26 M 376 18 L 370 24" class="link-icon" />
    <text x="20" y="52" class="proj-desc">Scalable TypeScript systems integration for national-scale</text>
    <text x="20" y="68" class="proj-desc">open digital identity infrastructure.</text>
    <!-- Tags -->
    <rect x="20" y="98" width="78" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="59" y="113" text-anchor="middle" class="tag-pine">TypeScript</text>
    <rect x="106" y="98" width="62" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="137" y="113" text-anchor="middle" class="tag-pine">Systems</text>
    <rect x="176" y="98" width="60" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="206" y="113" text-anchor="middle" class="tag-pine">Identity</text>
  </g>

  <!-- Card 6: cornflakes-copilot- (Bottom Right) -->
  <g transform="translate(446, 389)">
    <rect width="396" height="140" rx="10" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1" filter="url(#card-shadow)" />
    <rect x="0" y="0" width="4" height="140" fill="#064E3B" clip-path="url(#card-clip)" />
    <text x="20" y="28" class="title-pine"><tspan class="emoji">🌽</tspan><tspan dx="7">cornflakes-copilot-</tspan></text>
    <path d="M 368 18 L 376 18 M 376 18 L 376 26 M 376 18 L 370 24" class="link-icon" />
    <text x="20" y="52" class="proj-desc">Autonomous SRE &amp; incident triage copilot — deterministic</text>
    <text x="20" y="68" class="proj-desc">tools, BM25 runbook RAG, chaos tests &amp; self-healing.</text>
    <!-- Tags -->
    <rect x="20" y="98" width="65" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="52" y="113" text-anchor="middle" class="tag-pine">FastAPI</text>
    <rect x="93" y="98" width="80" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="133" y="113" text-anchor="middle" class="tag-pine">AI Agents</text>
    <rect x="181" y="98" width="95" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
    <text x="228" y="113" text-anchor="middle" class="tag-pine">Docker &bull; RAG</text>
  </g>
</svg>
