<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="100%">
  <defs>
    <!-- Background Canvas matching GitHub Dark Mode -->
    <linearGradient id="tech-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
  </defs>

  <style>
    .meta-tag {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #A1A1AA;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.3px;
      fill: #FAF5EE;
    }
    .col-header {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .skill-item {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      fill: #D4D4D8;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="880" height="250" rx="10" fill="url(#tech-bg-dark)" stroke="#30363D" stroke-width="1" />

  <!-- Section Header -->
  <g transform="translate(36, 30)">
    <text x="0" y="0" class="meta-tag">04 // PRODUCTION STACK &amp; VERIFIED TOOLING</text>
    <text x="0" y="24" class="main-title">Core Engineering &amp; Research Toolchain</text>
  </g>

  <!-- Column 1: Research & Deep Learning -->
  <g transform="translate(36, 78)">
    <rect width="258" height="142" rx="8" fill="#11161D" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="142" fill="#F59E0B" rx="1.75" />
    <g transform="translate(18, 24)">
      <text x="0" y="0" class="col-header" fill="#F59E0B">RESEARCH &amp; DEEP LEARNING</text>
      <g transform="translate(0, 18)">
        <circle cx="2" cy="6" r="2" fill="#F59E0B" />
        <text x="12" y="10" class="skill-item">PyTorch &amp; Transformers</text>

        <circle cx="2" cy="28" r="2" fill="#F59E0B" />
        <text x="12" y="32" class="skill-item">EEG/ECG Signal Processing</text>

        <circle cx="2" cy="50" r="2" fill="#F59E0B" />
        <text x="12" y="54" class="skill-item">Explainable AI (SHAP/Attn)</text>

        <circle cx="2" cy="72" r="2" fill="#F59E0B" />
        <text x="12" y="76" class="skill-item">NumPy, SciPy &amp; Scikit-Learn</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Core Languages -->
  <g transform="translate(310, 78)">
    <rect width="258" height="142" rx="8" fill="#11161D" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="142" fill="#10B981" rx="1.75" />
    <g transform="translate(18, 24)">
      <text x="0" y="0" class="col-header" fill="#10B981">CORE LANGUAGES</text>
      <g transform="translate(0, 18)">
        <circle cx="2" cy="6" r="2" fill="#10B981" />
        <text x="12" y="10" class="skill-item">Python (Async, Scientific)</text>

        <circle cx="2" cy="28" r="2" fill="#10B981" />
        <text x="12" y="32" class="skill-item">Modern C++ (17/20, Systems)</text>

        <circle cx="2" cy="50" r="2" fill="#10B981" />
        <text x="12" y="54" class="skill-item">TypeScript &amp; JavaScript</text>

        <circle cx="2" cy="72" r="2" fill="#10B981" />
        <text x="12" y="76" class="skill-item">Bash / POSIX Shell Scripting</text>
      </g>
    </g>
  </g>

  <!-- Column 3: Systems & Infrastructure -->
  <g transform="translate(584, 78)">
    <rect width="258" height="142" rx="8" fill="#11161D" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="142" fill="#10B981" rx="1.75" />
    <g transform="translate(18, 24)">
      <text x="0" y="0" class="col-header" fill="#10B981">SYSTEMS &amp; INFRASTRUCTURE</text>
      <g transform="translate(0, 18)">
        <circle cx="2" cy="6" r="2" fill="#10B981" />
        <text x="12" y="10" class="skill-item">Docker &amp; Linux Internals</text>

        <circle cx="2" cy="28" r="2" fill="#10B981" />
        <text x="12" y="32" class="skill-item">FastAPI &amp; Asynchronous APIs</text>

        <circle cx="2" cy="50" r="2" fill="#10B981" />
        <text x="12" y="54" class="skill-item">PostgreSQL &amp; Vector Stores</text>

        <circle cx="2" cy="72" r="2" fill="#10B981" />
        <text x="12" y="76" class="skill-item">Git &amp; GitHub Actions CI/CD</text>
      </g>
    </g>
  </g>
</svg>
