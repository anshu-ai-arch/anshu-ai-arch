<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" height="100%">
  <defs>
    <linearGradient id="sub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1416" />
      <stop offset="100%" stop-color="#081010" />
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6719" />
      <stop offset="100%" stop-color="#ff8533" />
    </linearGradient>
  </defs>

  <style>
    .sub-tag {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #ff6719;
      text-transform: uppercase;
    }
    .sub-head {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
      fill: #ffffff;
    }
    .sub-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      fill: #94a3b8;
    }
    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #ffffff;
    }
  </style>

  <!-- Background Base -->
  <rect width="880" height="160" rx="14" fill="url(#sub-bg)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Left Accent Strip -->
  <rect x="0" y="0" width="4" height="160" rx="2" fill="#ff6719" />

  <!-- Content Left -->
  <g transform="translate(36, 36)">
    <text x="0" y="0" class="sub-tag">PUBLICATIONS &amp; ESSAYS // SUBSTACK</text>
    <text x="0" y="24" class="sub-head">The AI Architect Journal by Anshu Tiwari</text>
    <text x="0" y="46" class="sub-desc">Long-form technical breakdowns on autonomous agent workflows, model reasoning, and scalable AI infrastructure.</text>
    <text x="0" y="66" class="sub-desc" fill="#34d399">Regular dispatches exploring frontier foundation models and computational architecture.</text>
  </g>

  <!-- CTA Button Right -->
  <g transform="translate(640, 58)">
    <rect width="200" height="44" rx="8" fill="url(#btn-grad)" />
    <text x="100" y="27" text-anchor="middle" class="btn-text">Read on Substack &rarr;</text>
  </g>
</svg>
