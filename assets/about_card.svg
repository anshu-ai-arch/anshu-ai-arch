<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Linear Gradient -->
    <linearGradient id="wave-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Waveform Technical Coordinate Grid -->
    <pattern id="telemetry-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#30363D" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .section-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #A1A1AA;
    }
    .intro-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.3px;
      fill: #FAF5EE;
    }
    .intro-body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
      fill: #A1A1AA;
    }
    .signal-label {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .signal-data {
      font-family: ui-monospace, monospace;
      font-size: 9.5px;
      fill: #71717A;
    }
    .ecg-line {
      fill: none;
      stroke: #10B981;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .eeg-line {
      fill: none;
      stroke: #F59E0B;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .axis-marker {
      font-family: ui-monospace, monospace;
      font-size: 8.5px;
      fill: #52525B;
    }
  </style>

  <!-- Container Box -->
  <rect width="880" height="290" rx="10" fill="url(#wave-bg)" stroke="#30363D" stroke-width="1" />

  <!-- Intro Block (Top Half) -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" class="section-mono">01 // IDENTITY &amp; RESEARCH FOUNDATION</text>
    <text x="0" y="26" class="intro-title">Building Intelligent Systems. Researching What Makes Them Work.</text>
    <text x="0" y="48" class="intro-body">
      Focused on bridging foundational biomedical signal deep learning (ECG &amp; multi-channel EEG) with
    </text>
    <text x="0" y="66" class="intro-body">
      production-grade autonomous agent workflows, model interpretability (XAI), and deterministic execution.
    </text>
  </g>

  <!-- Waveform Telemetry Scope Display (Bottom Half) -->
  <g transform="translate(36, 126)">
    <!-- Scope Screen Background -->
    <rect width="808" height="134" rx="8" fill="#090D11" stroke="#30363D" stroke-width="1" />
    <rect width="808" height="134" rx="8" fill="url(#telemetry-grid)" />

    <!-- Wave 1: EEG Brainwave Oscillations (Alpha / Beta Rhythms with Seizure Complex) -->
    <g transform="translate(18, 14)">
      <!-- Channel Label -->
      <text x="0" y="10" class="signal-label" fill="#F59E0B">EEG CH-04 [FP1-F3] // 256 Hz</text>
      <text x="195" y="10" class="signal-data">&bull; BAND: 8-13 Hz (ALPHA) &bull; XAI ATTENTION SALIENCY: 0.884</text>

      <!-- EEG Continuous Oscillatory Vector Waveform -->
      <path d="M 0 32
               Q 12 24, 24 32 T 48 32 T 72 34 T 96 28 T 120 36 T 144 26 T 168 34 T 192 30
               Q 204 18, 214 44 T 226 12 T 238 52 T 248 8 T 258 42 T 270 26 T 282 34
               Q 294 30, 308 34 T 332 28 T 356 36 T 380 30 T 404 34 T 428 26 T 452 36 T 476 30
               Q 488 16, 498 48 T 510 10 T 522 56 T 534 6 T 544 40 T 556 24 T 568 32
               Q 580 30, 594 34 T 618 28 T 642 36 T 666 30 T 690 32 T 714 28 T 738 34 T 760 30"
            class="eeg-line" />
    </g>

    <!-- Horizontal Channel Divider -->
    <line x1="18" y1="72" x2="790" y2="72" stroke="#30363D" stroke-width="0.8" stroke-dasharray="4 4" />

    <!-- Wave 2: ECG Diagnostic Cardiac Signal (P-QRS-T Physiological Complex) -->
    <g transform="translate(18, 76)">
      <!-- Channel Label -->
      <text x="0" y="12" class="signal-label" fill="#10B981">ECG LEAD-II [CARDIAC TELEMETRY] // 500 Hz</text>
      <text x="255" y="12" class="signal-data">&bull; PR: 156ms &bull; QRS: 88ms &bull; QT: 392ms &bull; RHYTHM: NORMAL SINUS</text>

      <!-- Exact P-QRS-T Physiological Complex across 4 Cardiac Cycles -->
      <path d="M 0 34
               L 40 34
               Q 48 30, 56 34
               L 66 34
               L 70 37
               L 76 6
               L 82 46
               L 86 34
               L 98 34
               Q 112 25, 126 34
               L 220 34
               Q 228 30, 236 34
               L 246 34
               L 250 37
               L 256 6
               L 262 46
               L 266 34
               L 278 34
               Q 292 25, 306 34
               L 410 34
               Q 418 30, 426 34
               L 436 34
               L 440 37
               L 446 6
               L 452 46
               L 456 34
               L 468 34
               Q 482 25, 496 34
               L 590 34
               Q 598 30, 606 34
               L 616 34
               L 620 37
               L 626 6
               L 632 46
               L 636 34
               L 648 34
               Q 662 25, 676 34
               L 760 34"
            class="ecg-line" />
    </g>

    <!-- Calibration Voltage Scale on Right -->
    <g transform="translate(772, 28)">
      <line x1="0" y1="0" x2="0" y2="80" stroke="#52525B" stroke-width="0.8" />
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#52525B" stroke-width="0.8" />
      <line x1="-3" y1="80" x2="3" y2="80" stroke="#52525B" stroke-width="0.8" />
      <text x="6" y="44" class="axis-marker">1 mV</text>
    </g>
  </g>
</svg>