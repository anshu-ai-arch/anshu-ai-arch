<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d10" />
      <stop offset="50%" stop-color="#0b1414" />
      <stop offset="100%" stop-color="#081010" />
    </linearGradient>

    <!-- Layer 3 Gradient (Agentic) -->
    <linearGradient id="layer3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.08" />
    </linearGradient>

    <!-- Layer 2 Gradient (Models) -->
    <linearGradient id="layer2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08" />
    </linearGradient>

    <!-- Layer 1 Gradient (Systems) -->
    <linearGradient id="layer1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.08" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .header-tag {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #10b981;
    }
    .header-main {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      fill: #ffffff;
    }
    .header-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      fill: #94a3b8;
    }
    .tier-label {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #6ee7b7;
      text-transform: uppercase;
    }
    .tier-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #ffffff;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #e2e8f0;
    }
  </style>

  <!-- Canvas Base -->
  <rect width="880" height="370" rx="16" fill="url(#stack-bg)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Title Header -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" class="header-tag">ARCHITECTURE BLUEPRINT // ANSHU TIWARI</text>
    <text x="0" y="24" class="header-main">AI Research &amp; Autonomous Systems Stack</text>
    <text x="0" y="44" class="header-desc">Hierarchical architectural framework from low-level systems execution to cognitive agent reasoning</text>
  </g>

  <!-- ================= TIER 3: AGENTIC LAYER ================= -->
  <g transform="translate(36, 100)">
    <!-- Container -->
    <rect width="808" height="70" rx="10" fill="url(#layer3-grad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Left Indicator Strip -->
    <rect x="0" y="0" width="5" height="70" rx="2" fill="#10b981" />

    <!-- Label & Title -->
    <text x="24" y="26" class="tier-label">TIER 03 // COGNITIVE AGENTIC LAYER</text>
    <text x="24" y="48" class="tier-title">Autonomous Agents &amp; Multi-Agent Swarms</text>

    <!-- Component Chips (Right Side) -->
    <g transform="translate(370, 18)">
      <rect x="0" y="0" width="138" height="34" rx="6" fill="#0d1817" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <text x="12" y="22" class="chip-text">⬡ Dynamic Planning</text>

      <rect x="148" y="0" width="138" height="34" rx="6" fill="#0d1817" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <text x="12" y="22" class="chip-text">🧠 Memory &amp; RAG</text>

      <rect x="296" y="0" width="132" height="34" rx="6" fill="#0d1817" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <text x="12" y="22" class="chip-text">⚡ Tool Orchestration</text>
    </g>
  </g>

  <!-- Vertical Connecting Data Flow 1 -->
  <g transform="translate(440, 172)">
    <line x1="0" y1="0" x2="0" y2="14" stroke="#10b981" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="3 3" />
  </g>

  <!-- ================= TIER 2: MODEL LAYER ================= -->
  <g transform="translate(36, 188)">
    <!-- Container -->
    <rect width="808" height="70" rx="10" fill="url(#layer2-grad)" stroke="#059669" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Left Indicator Strip -->
    <rect x="0" y="0" width="5" height="70" rx="2" fill="#34d399" />

    <!-- Label & Title -->
    <text x="24" y="26" class="tier-label">TIER 02 // NEURAL FOUNDATION LAYER</text>
    <text x="24" y="48" class="tier-title">Frontier Models &amp; Deep Learning</text>

    <!-- Component Chips (Right Side) -->
    <g transform="translate(370, 18)">
      <rect x="0" y="0" width="138" height="34" rx="6" fill="#0b1716" stroke="#059669" stroke-width="1" stroke-opacity="0.3" />
      <text x="12" y="22" class="chip-text">🔥 PyTorch Workflows</text>

      <rect x="148" y="0" width="138" height="34" rx="6" fill="#0b1716" stroke="#059669" stroke-width="1" stroke-opacity="0.3" />
      <text x="12" y="22" class="chip-text">🤗 Transformer Models</text>

      <rect x="296" y="0" width="132" height="34" rx="6" fill="#0b1716" stroke="#059669" stroke-width="1" stroke-opacity="0.3" />
      <text x="12" y="22" class="chip-text">📊 Model Tuning</text>
    </g>
  </g>

  <!-- Vertical Connecting Data Flow 2 -->
  <g transform="translate(440, 260)">
    <line x1="0" y1="0" x2="0" y2="14" stroke="#10b981" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="3 3" />
  </g>

  <!-- ================= TIER 1: SYSTEMS CORE ================= -->
  <g transform="translate(36, 276)">
    <!-- Container -->
    <rect width="808" height="70" rx="10" fill="url(#layer1-grad)" stroke="#047857" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Left Indicator Strip -->
    <rect x="0" y="0" width="5" height="70" rx="2" fill="#047857" />

    <!-- Label & Title -->
    <text x="24" y="26" class="tier-label">TIER 01 // HIGH-PERFORMANCE SYSTEMS CORE</text>
    <text x="24" y="48" class="tier-title">Algorithmic Engine &amp; Systems Runtime</text>

    <!-- Component Chips (Right Side) -->
    <g transform="translate(370, 18)">
      <rect x="0" y="0" width="138" height="34" rx="6" fill="#091414" stroke="#047857" stroke-width="1" stroke-opacity="0.3" />
      <text x="12" y="22" class="chip-text">⚡ High-Perf C++</text>

      <rect x="148" y="0" width="138" height="34" rx="6" fill="#091414" stroke="#047857" stroke-width="1" stroke-opacity="0.3" />
      <text x="12" y="22" class="chip-text">🐳 Docker &amp; Linux</text>

      <rect x="296" y="0" width="132" height="34" rx="6" fill="#091414" stroke="#047857" stroke-width="1" stroke-opacity="0.3" />
      <text x="12" y="22" class="chip-text">🚀 Asynchronous APIs</text>
    </g>
  </g>
</svg>
