<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching GitHub Dark Mode -->
    <linearGradient id="stack-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
  </defs>

  <style>
    .meta-tag {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #A1A1AA;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.3px;
      fill: #FAF5EE;
    }
    .pillar-header {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .block-label {
      font-family: ui-monospace, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .block-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #FAF5EE;
    }
    .pill-text {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      fill: #A1A1AA;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="880" height="380" rx="10" fill="url(#stack-bg-dark)" stroke="#30363D" stroke-width="1" />

  <!-- Section Header -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" class="meta-tag">02 // ARCHITECTURE &amp; RESEARCH SPECIFICATION</text>
    <text x="0" y="24" class="main-title">Dual-Domain AI Architecture</text>
  </g>

  <!-- ================= LEFT PILLAR: RESEARCH SCIENTIST ================= -->
  <g transform="translate(36, 80)">
    <!-- Column Outer Border -->
    <rect width="396" height="270" rx="8" fill="#11161D" stroke="#30363D" stroke-width="1" />
    <!-- Pillar Title Strip -->
    <rect x="0" y="0" width="396" height="32" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="16" y="21" class="pillar-header" fill="#F59E0B">01 / RESEARCH SCIENTIST DOMAIN</text>

    <!-- Block 1: Clinical Signal Intelligence -->
    <g transform="translate(14, 44)">
      <rect width="368" height="64" rx="6" fill="#161B22" stroke="#30363D" stroke-width="0.8" />
      <text x="14" y="18" class="block-label" fill="#F59E0B">PHYSIOLOGICAL SIGNALS</text>
      <text x="14" y="36" class="block-title">ECG &amp; EEG Deep Learning</text>
      <!-- Pills -->
      <g transform="translate(14, 44)">
        <text x="0" y="11" class="pill-text">&bull; Time-Series CNNs &bull; Seizure Modeling &bull; Cardiac Telemetry</text>
      </g>
    </g>

    <!-- Block 2: Model Interpretability -->
    <g transform="translate(14, 118)">
      <rect width="368" height="64" rx="6" fill="#161B22" stroke="#30363D" stroke-width="0.8" />
      <text x="14" y="18" class="block-label" fill="#F59E0B">INTERPRETABILITY</text>
      <text x="14" y="36" class="block-title">Explainable AI (XAI)</text>
      <g transform="translate(14, 44)">
        <text x="0" y="11" class="pill-text">&bull; Attention Maps &bull; Saliency Decoding &bull; Clinical Validation</text>
      </g>
    </g>

    <!-- Block 3: Transformer Interpretability -->
    <g transform="translate(14, 192)">
      <rect width="368" height="64" rx="6" fill="#161B22" stroke="#30363D" stroke-width="0.8" />
      <text x="14" y="18" class="block-label" fill="#F59E0B">MECHANISTIC STUDIES</text>
      <text x="14" y="36" class="block-title">Transformer Internals</text>
      <g transform="translate(14, 44)">
        <text x="0" y="11" class="pill-text">&bull; GPT-2 Attention Probing &bull; Activation Tracing &bull; Residuals</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT PILLAR: AI ENGINEER ================= -->
  <g transform="translate(448, 80)">
    <rect width="396" height="270" rx="8" fill="#11161D" stroke="#30363D" stroke-width="1" />
    <rect x="0" y="0" width="396" height="32" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="16" y="21" class="pillar-header" fill="#10B981">02 / AI SYSTEMS ENGINEER DOMAIN</text>

    <!-- Block 1: Autonomous Systems -->
    <g transform="translate(14, 44)">
      <rect width="368" height="64" rx="6" fill="#161B22" stroke="#30363D" stroke-width="0.8" />
      <text x="14" y="18" class="block-label" fill="#10B981">AGENTIC SYSTEMS</text>
      <text x="14" y="36" class="block-title">Multi-Agent Architectures</text>
      <g transform="translate(14, 44)">
        <text x="0" y="11" class="pill-text">&bull; Autonomous Swarms &bull; BM25 RAG &bull; Policy-as-Code</text>
      </g>
    </g>

    <!-- Block 2: Production ML Stack -->
    <g transform="translate(14, 118)">
      <rect width="368" height="64" rx="6" fill="#161B22" stroke="#30363D" stroke-width="0.8" />
      <text x="14" y="18" class="block-label" fill="#10B981">INFRASTRUCTURE</text>
      <text x="14" y="36" class="block-title">Production ML &amp; Serving</text>
      <g transform="translate(14, 44)">
        <text x="0" y="11" class="pill-text">&bull; PyTorch &bull; FastAPI Async &bull; Docker Containerization</text>
      </g>
    </g>

    <!-- Block 3: Full-Stack Systems -->
    <g transform="translate(14, 192)">
      <rect width="368" height="64" rx="6" fill="#161B22" stroke="#30363D" stroke-width="0.8" />
      <text x="14" y="18" class="block-label" fill="#10B981">RELIABILITY</text>
      <text x="14" y="36" class="block-title">SRE &amp; Systems Execution</text>
      <g transform="translate(14, 44)">
        <text x="0" y="11" class="pill-text">&bull; Exactly-Once Execution &bull; Chaos Tests &bull; PostgreSQL</text>
      </g>
    </g>
  </g>
</svg>
